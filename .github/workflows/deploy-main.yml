name: Deploy Public Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-public-site
  cancel-in-progress: false

jobs:
  deploy-public:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check deploy target
        env:
          CHATTOOL_DEPLOY_REPO: ${{ secrets.CHATTOOL_DEPLOY_REPO }}
          CHATTOOL_DEPLOY_BRANCH: ${{ vars.CHATTOOL_DEPLOY_BRANCH }}
        run: |
          test -n "$CHATTOOL_DEPLOY_REPO" || { echo "Missing CHATTOOL_DEPLOY_REPO secret"; exit 1; }
          echo "Deploy target: ${CHATTOOL_DEPLOY_REPO}"
          echo "Deploy branch: ${CHATTOOL_DEPLOY_BRANCH:-main}"

      - name: Deploy generated site
        env:
          CHATTOOL_DEPLOY_REPO: ${{ secrets.CHATTOOL_DEPLOY_REPO }}
          CHATTOOL_DEPLOY_BRANCH: ${{ vars.CHATTOOL_DEPLOY_BRANCH }}
          CHATTOOL_DEPLOY_TOKEN: ${{ secrets.CHATTOOL_DEPLOY_TOKEN }}
          GIT_SSH_COMMAND: ${{ secrets.CHATTOOL_DEPLOY_SSH_COMMAND }}
        run: |
          npx hexo deploy --generate
